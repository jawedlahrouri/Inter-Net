resolver 127.0.0.11 valid=5s ipv6=off;

log_format github_lb '$remote_addr "$request" $status '
                    'upstream=$upstream_addr cache=$upstream_http_x_cache '
                    'time=${request_time}s';

upstream github_service {
    zone github_service 64k;
    least_conn;
    server github-service:8080 resolve max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8080;
    access_log /var/log/nginx/access.log github_lb;

    location = /lb/health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://github_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
}
